
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prestige Certificate Studio</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f1eb;color:#242424;font-family:Georgia,serif}
header{background:#101b34;color:white;text-align:center;padding:32px 15px}
header h1{font-size:28px;letter-spacing:3px;margin:0}
header p{color:#d8bd7b;font:13px Arial;letter-spacing:1px}
main{max-width:1450px;margin:auto;padding:24px}
.section{background:white;padding:22px;border-radius:12px;margin-bottom:22px}
h2{font: bold 21px Arial;color:#172744}
.sub{font:14px Arial;color:#777}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}
.filter{background:#eee;color:#333;border:1px solid #ddd}
.filter.active{background:#172744;color:white}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:15px}
.design{padding:8px;border:2px solid #ddd;border-radius:9px;cursor:pointer;background:white}
.design:hover,.design.active{border-color:#b18b42}
.design.active{background:#fff9e9}
.thumb{width:100%;aspect-ratio:1.414;overflow:hidden;background:#fff}
.thumb svg{width:100%;height:100%;display:block}
.design h3{font:bold 13px Arial;margin:8px 0 3px}
.design small{font:11px Arial;color:#777}
.editor{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.field label{display:block;font:bold 12px Arial;margin-bottom:6px}
.field input,.field select{width:100%;padding:11px;border:1px solid #ccc;border-radius:6px;font-size:14px}
button{padding:11px 16px;border:0;border-radius:5px;background:#172744;color:white;cursor:pointer}
button:hover{background:#9c762f}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
#certificate{width:100%;aspect-ratio:1.414;position:relative;overflow:hidden;background:white;box-shadow:0 3px 18px #0002}
#certificate svg{position:absolute;inset:0;width:100%;height:100%}
.content{position:absolute;z-index:2;inset:13% 15%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.school{font:bold 1.8vw Arial;letter-spacing:2px;text-transform:uppercase}
.location{font:1vw Arial;margin-top:5px}
.heading{font:bold 2.8vw Georgia;text-transform:uppercase;margin:4% 0 2%;color:var(--ink)}
.awarded{font:1vw Arial;letter-spacing:4px}
.recipient{font:bold 3vw Georgia;color:var(--accent);border-bottom:2px solid var(--accent);padding:0 5% 1%;margin:2% 0}
.program{font:1.15vw Arial}
.award{font:bold 1.4vw Georgia;color:var(--accent);margin-top:2%}
.description{font:1vw Arial;line-height:1.5;max-width:85%;margin:3% auto}
.year{font:bold 1.3vw Georgia;margin-top:1%}
.date{font:1vw Arial;margin-top:1%}
.signatures{display:flex;justify-content:space-around;width:100%;gap:12%;margin-top:6%}
.sig{width:38%;border-top:1px solid #333;padding-top:7px;font:.9vw Arial}
.sig strong{display:block;font:bold 1.05vw Georgia}
.seal{position:absolute;z-index:3;right:16%;top:17%;width:9%;aspect-ratio:1;border:3px double var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--accent);font:bold .75vw Georgia;transform:rotate(10deg)}
@media(max-width:650px){
main{padding:10px}
.section{padding:13px}
header h1{font-size:20px}
.gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.editor{grid-template-columns:1fr}
}
@media print{
@page{size:A4 landscape;margin:0}
body{background:white}
header,.no-print{display:none!important}
main{padding:0;margin:0;max-width:none}
.preview{padding:0;margin:0}
#certificate{width:100vw;height:70.71vw;box-shadow:none}
}
</style>
</head>

<body>

<header>
<h1>PRESTIGE CERTIFICATE STUDIO</h1>
<p>CREATE • PERSONALIZE • CELEBRATE ACHIEVEMENT</p>
</header>

<main>

<section class="section no-print">
<h2>Explore Certificate Designs</h2>
<p class="sub">Choose a category and browse the available professional designs.</p>
<div class="filters" id="categories"></div>
<div class="filters" id="themes"></div>
<div class="gallery" id="gallery"></div>
</section>

<section class="section no-print">
<h2>Customize Your Certificate</h2>

<div class="editor">
<div class="field"><label>School / Organization Name</label><input id="school" value="YOUR SCHOOL NAME"></div>
<div class="field"><label>School Address</label><input id="location" value="School Address"></div>
<div class="field"><label>Recipient's Full Name</label><input id="recipient" placeholder="Enter full name"></div>
<div class="field"><label>Grade Level / Program</label><input id="program" value="Senior High School"></div>
<div class="field"><label>Award / Achievement</label><input id="award" placeholder="With Honors / Outstanding Student"></div>
<div class="field"><label>Graduation / Award Year</label><input id="year" value="2026"></div>
<div class="field"><label>Certificate Date</label><input id="date" placeholder="June 2026"></div>
<div class="field"><label>Certificate Heading</label><input id="heading" value="Certificate of Graduation"></div>
<div class="field"><label>First Signatory</label><input id="sign1" placeholder="Name of signatory"></div>
<div class="field"><label>First Position</label><input id="position1" value="School Principal"></div>
<div class="field"><label>Second Signatory</label><input id="sign2" placeholder="Name of signatory"></div>
<div class="field"><label>Second Position</label><input id="position2" value="School Head"></div>
</div>

<div class="actions">
<button onclick="updateCertificate()">Update Preview</button>
<button onclick="window.print()">Print / Save as PDF</button>
</div>
</section>

<section class="section preview">
<h2 class="no-print">Certificate Preview</h2>
<div id="certificate"></div>
</section>

</main>

<script>
const categories=[
"All","Graduation","Simple Awards","Academic Honors",
"Participation","Completion","Special Recognition"
];

const palettes=[
{name:"Royal Navy & Gold",bg:"#fffdf8",ink:"#142849",accent:"#c5a052",dark:"#10213b"},
{name:"Classic Gold",bg:"#fffdf6",ink:"#94712d",accent:"#c4a052",dark:"#795b24"},
{name:"Royal Blue & Silver",bg:"#fbfcff",ink:"#183c79",accent:"#a6b5c9",dark:"#183566"},
{name:"Burgundy & Gold",bg:"#fffaf8",ink:"#76283c",accent:"#c7a15c",dark:"#5d1c30"},
{name:"Black & Gold",bg:"#fffdf8",ink:"#222222",accent:"#c6a04d",dark:"#171717"},
{name:"Emerald & Gold",bg:"#fbfff9",ink:"#15543f",accent:"#c5a04d",dark:"#104332"}
];

const categoryTitles={
"Graduation":"Certificate of Graduation",
"Simple Awards":"Certificate of Recognition",
"Academic Honors":"Certificate of Academic Excellence",
"Participation":"Certificate of Participation",
"Completion":"Certificate of Completion",
"Special Recognition":"Certificate of Appreciation"
};

const categoriesEl=document.getElementById("categories");
const themesEl=document.getElementById("themes");
const gallery=document.getElementById("gallery");

let selected=0;
let categoryFilter="All";
let themeFilter="All";

function esc(s){
return String(s).replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));
}

function leaf(x,y,angle,color){
return `<ellipse cx="${x}" cy="${y}" rx="17" ry="6" transform="rotate(${angle} ${x} ${y})" fill="${color}"/>`;
}

function flower(x,y,color){
let s="";
for(let i=0;i<8;i++){
let a=i*Math.PI/4;
let px=x+Math.cos(a)*13,py=y+Math.sin(a)*13;
s+=`<ellipse cx="${px}" cy="${py}" rx="8" ry="4" transform="rotate(${i*45} ${px} ${py})" fill="${color}"/>`;
}
return s+`<circle cx="${x}" cy="${y}" r="5" fill="#fff" stroke="${color}" stroke-width="2"/>`;
}

function star(x,y,r,c){
return `<path d="M${x} ${y-r}L${x+r*.3} ${y-r*.3}L${x+r} ${y}L${x+r*.3} ${y+r*.3}L${x} ${y+r}L${x-r*.3} ${y+r*.3}L${x-r} ${y}L${x-r*.3} ${y-r*.3}Z" fill="${c}"/>`;
}

function laurel(x,y,flip,c){
let out="";
for(let i=0;i<9;i++){
let yy=y+i*15;
let xx=x+(flip?-1:1)*i*3;
out+=leaf(xx,yy,flip?145:35,c);
}
return out;
}

function decorations(p,n){
let a=p.accent,b=p.ink;
let s=`
<rect x="18" y="18" width="964" height="671" fill="none" stroke="${b}" stroke-width="7"/>
<rect x="31" y="31" width="938" height="645" fill="none" stroke="${a}" stroke-width="3"/>
<rect x="45" y="45" width="910" height="617" fill="none" stroke="${b}" stroke-width="1"/>
`;

const designs=n%10;

if(designs===0){
s+=`<path d="M50 220V50H220 M780 50H950V220 M50 487V657H220 M780 657H950V487" stroke="${a}" stroke-width="8" fill="none"/>
<path d="M55 150Q100 45 210 80Q170 130 55 150 M945 150Q900 45 790 80Q830 130 945 150" fill="${a}" opacity=".6"/>`;
}
if(designs===1){
s+=`<rect x="65" y="65" width="870" height="577" rx="28" fill="none" stroke="${a}" stroke-width="6"/>
<rect x="80" y="80" width="840" height="547" rx="20" fill="none" stroke="${b}" stroke-width="2"/>`;
}
if(designs===2){
s+=`<path d="M50 100L170 50L290 100 M710 100L830 50L950 100 M50 607L170 657L290 607 M710 607L830 657L950 607" fill="none" stroke="${a}" stroke-width="5"/>
<path d="M80 120H920 M80 587H920" stroke="${b}" stroke-width="2"/>`;
}
if(designs===3){
s+=`<path d="M65 65L220 180L65 295 M935 65L780 180L935 295 M65 642L220 527L65 412 M935 642L780 527L935 412" fill="none" stroke="${a}" stroke-width="5"/>`;
}
if(designs===4){
s+=`<ellipse cx="500" cy="350" rx="420" ry="270" fill="none" stroke="${a}" stroke-width="4"/>
<ellipse cx="500" cy="350" rx="405" ry="255" fill="none" stroke="${b}" stroke-width="2"/>`;
}
if(designs===5){
s+=`<path d="M80 80V627 M920 80V627 M100 80V627 M900 80V627" stroke="${a}" stroke-width="4"/>
<path d="M55 80H130 M870 80H945 M55 627H130 M870 627H945" stroke="${b}" stroke-width="5"/>`;
}
if(designs===6){
s+=`<path d="M60 200Q60 55 210 55Q270 55 300 130 M940 200Q940 55 790 55Q730 55 700 130 M60 507Q60 652 210 652Q270 652 300 577 M940 507Q940 652 790 652Q730 652 700 577" fill="none" stroke="${a}" stroke-width="5"/>`;
}
if(designs===7){
s+=`<path d="M45 45H955V662H45Z" fill="none" stroke="${a}" stroke-width="9"/>
<path d="M65 65H935V642H65Z" fill="none" stroke="${b}" stroke-width="2"/>
<path d="M45 45L145 145 M955 45L855 145 M45 662L145 562 M955 662L855 562" stroke="${a}" stroke-width="5"/>`;
}
if(designs===8){
s+=`<g fill="none" stroke="${a}" stroke-width="4">
<path d="M50 140Q180 30 310 140T570 140T950 140"/>
<path d="M50 567Q180 677 310 567T570 567T950 567"/>
</g>`;
}
if(designs===9){
s+=`<path d="M80 80H920V627H80Z" fill="none" stroke="${a}" stroke-width="5"/>
<path d="M95 95H905V612H95Z" fill="none" stroke="${b}" stroke-width="2"/>
<path d="M80 80L180 180 M920 80L820 180 M80 627L180 527 M920 627L820 527" stroke="${a}" stroke-width="5"/>`;
}

// floral ornaments
s+=`<g>${flower(90,90,a)}${flower(910,90,a)}${flower(90,617,a)}${flower(910,617,a)}</g>`;
s+=`<g>${laurel(320,95,0,a)}${laurel(680,95,1,a)}</g>`;

// central academic emblem and decorative dividers
s+=`
<circle cx="500" cy="350" r="48" fill="${p.bg}" stroke="${a}" stroke-width="5"/>
<circle cx="500" cy="350" r="39" fill="none" stroke="${b}" stroke-width="2"/>
${star(500,350,23,a)}
<path d="M260 190H740 M260 520H740" stroke="${a}" stroke-width="2"/>
<path d="M300 198H700 M300 512H700" stroke="${b}" stroke-width="1"/>
${star(500,190,9,a)}${star(500,520,9,a)}
`;
return s;
}

function frameSVG(p,n,category){
let deco=decorations(p,n);
let badge=category==="Graduation"?"GRADUATE":
category==="Academic Honors"?"HONORS":
category==="Participation"?"PARTICIPANT":
category==="Completion"?"COMPLETED":
category==="Special Recognition"?"AWARD":
"EXCELLENCE";

return `<svg viewBox="0 0 1000 707" xmlns="http://www.w3.org/2000/svg">
<rect width="1000" height="707" fill="${p.bg}"/>
${deco}
<path d="M375 125H625" stroke="${p.accent}" stroke-width="4"/>
<path d="M430 125L500 92L570 125" fill="none" stroke="${p.accent}" stroke-width="3"/>
<text x="500" y="168" text-anchor="middle" font-family="Georgia" font-size="17" letter-spacing="5" fill="${p.ink}">${badge}</text>
<path d="M380 570H620" stroke="${p.accent}" stroke-width="3"/>
</svg>`;
}

function makeFilters(){
categories.forEach(name=>{
let b=document.createElement("button");
b.className="filter"+(name==="All"?" active":"");
b.textContent=name;
b.onclick=()=>{categoryFilter=name;renderGallery();};
categoriesEl.appendChild(b);
});

palettes.forEach(p=>{
let b=document.createElement("button");
b.className="filter"+(p.name==="Royal Navy & Gold"?" active":"");
b.textContent=p.name;
b.onclick=()=>{themeFilter=p.name;renderGallery();};
themesEl.appendChild(b);
});
}

function renderGallery(){
categoriesEl.querySelectorAll("button").forEach(b=>b.classList.toggle("active",b.textContent===categoryFilter));
themesEl.querySelectorAll("button").forEach(b=>b.classList.toggle("active",b.textContent===themeFilter));

gallery.innerHTML="";
for(let i=0;i<100;i++){
let category=categories[1+Math.floor(i/17)];
if(i>=85)category="Special Recognition";
let p=palettes[i%6];

if(categoryFilter!=="All"&&category!==categoryFilter)continue;
if(themeFilter!=="All"&&p.name!==themeFilter)continue;

let card=document.createElement("div");
card.className="design"+(i===selected?" active":"");
card.innerHTML=`
<div class="thumb">${frameSVG(p,i,category)}</div>
<h3>Certificate Design ${String(i+1).padStart(2,"0")}</h3>
<small>${category} · ${p.name}</small>`;
card.onclick=()=>{
selected=i;
renderGallery();
updateCertificate();
};
gallery.appendChild(card);
}
}

function val(id){return document.getElementById(id).value.trim();}

function updateCertificate(){
let category=categories[1+Math.floor(selected/17)];
if(selected>=85)category="Special Recognition";

let p=palettes[selected%6];
let cert=document.getElementById("certificate");
cert.style.setProperty("--ink",p.ink);
cert.style.setProperty("--accent",p.accent);

let heading=val("heading")||categoryTitles[category];

cert.innerHTML=`
${frameSVG(p,selected,category)}
<div class="seal">${esc(val("year"))}<br>${category==="Graduation"?"GRAD": "AWARD"}</div>
<div class="content">
<div class="school">${esc(val("school"))}</div>
<div class="location">${esc(val("location"))}</div>
<div class="heading">${esc(heading)}</div>
<div class="awarded">THIS CERTIFICATE IS AWARDED TO</div>
<div class="recipient">${esc(val("recipient")||"RECIPIENT'S NAME")}</div>
<div class="program">${esc(val("program"))}</div>
<div class="award">${esc(val("award"))}</div>
<div class="description">
In recognition of dedication, achievement, and valuable contributions.
This certificate is awarded in honor of this special accomplishment.
</div>
<div class="year">CLASS OF ${esc(val("year"))}</div>
<div class="date">${esc(val("date"))}</div>
<div class="signatures">
<div class="sig"><strong>${esc(val("sign1"))}</strong>${esc(val("position1"))}</div>
<div class="sig"><strong>${esc(val("sign2"))}</strong>${esc(val("position2"))}</div>
</div>
</div>`;
}

document.getElementById("heading").addEventListener("input",updateCertificate);
makeFilters();
renderGallery();
updateCertificate();
</script>
</body>
</html>
